; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32_s3_n8r8
framework = arduino
debug_tool = esp-builtin
debug_load_mode = manual
debug_init_break = tbreak setup
board_build.f_cpu = 240000000L
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
debug_speed = 12000
build_type = debug
extra_scripts = pre:select_elegantota.py, merge-bin.py, set_mklittlefs.py
board_build.filesystem = littlefs
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.3
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit seesaw Library @ ^1.6.3
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit BusIO @ ^1.14.1
	adafruit/Adafruit BNO055 @ ^1.6.1
	adafruit/Adafruit Unified Sensor @ ^1.1.7
	kosme/arduinoFFT@^1.5.6
	.\lib\ElegantOTAPro-3-1-4
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.11.0
	bblanchon/ArduinoJson@^6.21.5
	adafruit/Adafruit NeoPixel @ ^1.12.4
	https://github.com/BaiTian6641/ProtoGC.git
	https://github.com/BaiTian6641/ESP32-HUB75-MatrixPanel-DMA.git#feature/prototracer-memory-opt
	ricmoo/QRCode @ ^0.0.1
	sparkfun/SparkFun APDS9960 RGB and Gesture Sensor @ ^1.4.3
	https://github.com/BaiTian6641/RevEng_PAJ7620.git
	https://github.com/m5stack/M5GFX.git
	https://github.com/m5stack/M5Unified.git
	ayushsharma82/NetWizard@^1.2.0
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-O3 -g
	-D TASESP32S3
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_USE=SPIRAM_USE_MALLOC
	-D CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP
	-D CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER
	-D CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER
	-D CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=2
	-D CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
	-D CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
	-D CONFIG_ESP_WIFI_CSI_ENABLED=n
	-D CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST
	-D CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY
	-D CONFIG_BTDM_CTRL_MODE_BLE_ONLY
	-D CONFIG_SPIRAM_XIP_FROM_PSRAM
	-D CONFIG_SPIRAM_MEMTEST
	-D CONFIG_SPIRAM_ALLOW_NOINIT_SEG_EXTERNAL_MEMORY
	-D CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY
	-D CONFIG_SPIRAM_FETCH_INSTRUCTIONS
	-D CONFIG_SPIRAM_RODATA
	-D CONFIG_SPIRAM_SPEED_80M
	-D CONFIG_SPIRAM_BOOT_INIT
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USE_PSRAM_FOR_FACE_JSON
	-D NETWIZARD_USE_ASYNC_WEBSERVER=1
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D OTA_BTN=14
	-D CONFIG_IDF_TARGET_ESP32S3
	-D CONFIG_SPIRAM_ECC_ENABLE
	-D SPIRAM_DMA_BUFFER
	-D HUB75_SPIRAM_DEFERRED_CACHE_FLUSH=1
	-D HUB75_PIXEL_COLOR_DEPTH_BITS=8
	-D HUB75_PIXEL_COLOR_DEPTH_RETRY_BITS=8

